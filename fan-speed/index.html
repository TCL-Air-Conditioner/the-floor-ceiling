
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Floor &amp; Ceiling | Fan Speed Adjusting</title>

<style>
:root {
    --navy: #17345f;
    --blue-gray: #637b98;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
    padding: 20px;
}

.logo {
    width: 90px;
    margin-bottom: 8px;
}

h1 {
    color: var(--navy);
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 25px;
}

.video-title {
    color: var(--blue-gray);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 15px;
}

.video-box {
    width: 90vw;
    max-width: 850px;
    aspect-ratio: 16 / 9;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    background: #081423;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.preview-button {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: #081423;
    cursor: pointer;
}

.preview-button img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.play-icon {
    position: relative;
    z-index: 1;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 4px;
    border-radius: 50%;
    background: rgba(23, 52, 95, 0.88);
    color: #fff;
    font-size: 31px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .2);
}

.preview-button[hidden],
.video-message[hidden] {
    display: none;
}

.video-message {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px;
    background: rgba(8, 20, 35, .9);
    color: #fff;
    font-size: 15px;
    text-align: center;
}

.video-message a {
    color: #afd8ff;
}

@media (max-width: 600px) {
    .container {
        padding: 15px;
    }

    .logo {
        width: 75px;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 20px;
    }

    .video-title {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .play-icon {
        width: 56px;
        height: 56px;
        font-size: 28px;
    }
}
</style>
<link rel="stylesheet" href="../assets/training-player.css">
</head>

<body>
<div class="container">

    <img
        class="logo"
        src="../brand-logo.png"
        alt="TCL Logo"
    >

    <h1>The Floor &amp; Ceiling</h1>

    <div class="video-title">Fan Speed Adjusting</div>

    <div class="video-box">

        <video
            id="trainingVideo"
            controls
            preload="auto"
            playsinline
            webkit-playsinline
        >
            <source src="fanspeed.mp4" type="video/mp4">
            Your browser does not support HTML video.
        </video>

        <button
            class="preview-button"
            id="previewButton"
            type="button"
            aria-label="Play Fan Speed Adjusting video"
        >
            <img
                src="preview-fan-speed.jpg"
                alt="Fan Speed Adjusting video preview"
            >
            <span class="play-icon" aria-hidden="true">&#9654;</span>
        </button>

    </div>

    <div class="player-status-slot">
        <div class="player-status" id="videoMessage" hidden>
            <span id="messageText" role="status" aria-live="polite" aria-atomic="true"></span>
            <button id="retryButton" type="button" hidden>Reload video</button>
            <a id="directVideoLink" href="fanspeed.mp4" target="_blank" rel="noopener" hidden>Open MP4 directly</a>
        </div>
    </div>

    <nav class="video-directory" aria-label="Product video directory">
        <h2>Operation Videos</h2>
        <ul>
            <li><a href="../fan-speed/" aria-current="page"><span>Fan Speed Adjusting</span><span class="current-video-label">Now playing</span></a></li>
            <li><a href="../vertical-swing/"><span>Vertical Swing</span></a></li>
            <li><a href="../eco-mode/"><span>Eco Mode</span></a></li>
            <li><a href="../mode-switch/"><span>Mode Switch</span></a></li>
            <li><a href="../horizontal-swing/"><span>Horizontal Swing</span></a></li>
            <li><a href="../app-connect/"><span>APP Connection</span></a></li>
            <li><a href="../filter-installation/"><span>Filter Installation</span></a></li>
            <li><a href="../filter-removal/"><span>Filter Removal</span></a></li>
        </ul>
    </nav>

</div>



<script src="../assets/training-player.js" defer></script>
</body>
</html>
