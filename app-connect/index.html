
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TCL The Floor &amp; Ceiling | APP Connection</title>

<style>
:root {
    --navy: #17345f;
    --blue-gray: #637b98;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
    padding: 20px;
}

.logo {
    width: 90px;
    margin-bottom: 8px;
}

h1 {
    color: var(--navy);
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 25px;
}

.video-title {
    color: var(--blue-gray);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 15px;
}

.video-box {
    width: 90vw;
    max-width: 850px;
    aspect-ratio: 16 / 9;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    background: #081423;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.preview-button {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: #081423;
    cursor: pointer;
}

.preview-button img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.play-icon {
    position: relative;
    z-index: 1;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 4px;
    border-radius: 50%;
    background: rgba(23, 52, 95, 0.88);
    color: #fff;
    font-size: 31px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .2);
}

.preview-button[hidden],
.video-message[hidden] {
    display: none;
}

.video-message {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px;
    background: rgba(8, 20, 35, .9);
    color: #fff;
    font-size: 15px;
    text-align: center;
}

.video-message a {
    color: #afd8ff;
}

@media (max-width: 600px) {
    .container {
        padding: 15px;
    }

    .logo {
        width: 75px;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 20px;
    }

    .video-title {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .play-icon {
        width: 56px;
        height: 56px;
        font-size: 28px;
    }
}
</style>
<style>
.player-status-slot,
.video-directory {
    width: 90vw;
    max-width: 850px;
    margin: 0 auto;
}

.player-status-slot {
    min-height: 66px;
    padding-top: 12px;
}

.player-status {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px 14px;
    padding: 12px;
    border: 1px solid #d7e3ef;
    background: #f3f8fd;
    color: #17345f;
    font-size: 14px;
    line-height: 1.5;
}

.player-status[hidden],
.player-status [hidden] {
    display: none;
}

.player-status button {
    padding: 8px 14px;
    border: 1px solid #17345f;
    border-radius: 0;
    background: #17345f;
    color: #fff;
    font: inherit;
    cursor: pointer;
    min-height: 44px;
}

.player-status a {
    color: #17345f;
    text-underline-offset: 3px;
}

.video-directory {
    padding: 12px 0 8px;
    text-align: left;
}

.video-directory h2 {
    margin: 0 0 12px;
    color: #17345f;
    font-size: 18px;
    line-height: 1.4;
    font-weight: 600;
}

.video-directory ul {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 0;
    padding: 0;
    list-style: none;
}

.video-directory li {
    min-width: 0;
}

.video-directory a {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px 12px;
    height: 100%;
    min-height: 48px;
    padding: 12px 14px;
    border: 1px solid #d7e3ef;
    background: #fff;
    color: #17345f;
    font-size: 15px;
    line-height: 1.45;
    text-decoration: none;
    overflow-wrap: anywhere;
}

.video-directory a:hover,
.video-directory a[aria-current="page"] {
    border-color: #17345f;
    background: #eaf3fc;
}

.video-directory a[aria-current="page"] {
    font-weight: 600;
}

.video-directory .current-video-label {
    color: #486580;
    font-size: 12px;
    font-weight: 400;
}

.player-status button:focus-visible,
.player-status a:focus-visible,
.video-directory a:focus-visible,
video:focus-visible {
    outline: 3px solid #1575c7;
    outline-offset: 3px;
}

@media (max-width: 600px) {
    .video-directory h2 { font-size: 17px; }
    .video-directory a { padding: 11px 12px; font-size: 14px; }
}

@media (max-width: 420px) {
    .video-directory ul { grid-template-columns: 1fr; }
}

</style>
</head>

<body>
<div class="container">

    <img
        class="logo"
        src="../brand-logo.png"
        alt="TCL Logo"
    >

    <h1>TCL The Floor &amp; Ceiling</h1>

    <div class="video-title">APP Connection</div>

    <div class="video-box">

        <video
            id="trainingVideo"
            controls
            preload="auto"
            playsinline
            webkit-playsinline
        >
            <source src="app-connect.mp4" type="video/mp4">
            Your browser does not support HTML video.
        </video>

        <button
            class="preview-button"
            id="previewButton"
            type="button"
            aria-label="Play APP Connection video"
        >
            <img
                src="preview-app-connect.jpg"
                alt="APP Connection video preview"
            >
            <span class="play-icon" aria-hidden="true">&#9654;</span>
        </button>

    </div>

    <div class="player-status-slot">
        <div class="player-status" id="videoMessage" hidden>
            <span id="messageText" role="status" aria-live="polite" aria-atomic="true"></span>
            <button id="retryButton" type="button" hidden>Reload video</button>
            <a id="directVideoLink" href="app-connect.mp4" target="_blank" rel="noopener" hidden>Open MP4 directly</a>
        </div>
    </div>

    <nav class="video-directory" aria-label="Product video directory">
        <h2>Operation Videos</h2>
        <ul>
            <li><a href="../fan-speed/"><span>Fan Speed Adjusting</span></a></li>
            <li><a href="../vertical-swing/"><span>Vertical Swing</span></a></li>
            <li><a href="../eco-mode/"><span>Eco Mode</span></a></li>
            <li><a href="../mode-switch/"><span>Mode Switch</span></a></li>
            <li><a href="../horizontal-swing/"><span>Horizontal Swing</span></a></li>
            <li><a href="../app-connect/" aria-current="page"><span>APP Connection</span><span class="current-video-label">Now playing</span></a></li>
            <li><a href="../filter-installation/"><span>Filter Installation</span></a></li>
            <li><a href="../filter-removal/"><span>Filter Removal</span></a></li>
        </ul>
    </nav>

</div>



<script>
(function () {
    'use strict';

    const video = document.getElementById('trainingVideo');
    const preview = document.getElementById('previewButton');
    const status = document.getElementById('videoMessage');
    const statusText = document.getElementById('messageText');
    const retry = document.getElementById('retryButton');
    const directLink = document.getElementById('directVideoLink');
    if (!video || !preview || !status || !statusText || !retry || !directLink) return;

    let requested = false;
    let hasPlayed = false;
    let phase = 'idle';
    let generation = 0;
    let pendingPlay = false;
    let savedPosition = null;
    let waitTimer = null;

    video.tabIndex = 0;

    function clearWaitTimer() {
        if (waitTimer !== null) clearTimeout(waitTimer);
        waitTimer = null;
    }

    function hideStatus() {
        clearWaitTimer();
        if (document.activeElement === retry || document.activeElement === directLink) focusVideo();
        status.hidden = true;
        retry.hidden = true;
        directLink.hidden = true;
    }

    function showWaiting(nextPhase) {
        // Repeated waiting/stalled events must not restart the recovery timer.
        if (phase === nextPhase && !status.hidden) return;
        clearWaitTimer();
        phase = nextPhase;
        statusText.textContent = nextPhase === 'buffering'
            ? 'Buffering video...'
            : 'Loading video...';
        retry.hidden = true;
        directLink.hidden = true;
        status.hidden = false;
        waitTimer = setTimeout(function () {
            waitTimer = null;
            if (requested && !video.ended && (pendingPlay || !video.paused) &&
                (phase === 'loading' || phase === 'buffering')) {
                statusText.textContent = 'Taking longer than expected. You can reload the video.';
                retry.hidden = false;
                directLink.hidden = false;
            }
        }, 15000);
    }

    function showError() {
        clearWaitTimer();
        pendingPlay = false;
        phase = 'error';
        statusText.textContent = 'Unable to load this video. Please try again.';
        retry.hidden = false;
        directLink.hidden = false;
        status.hidden = false;
    }

    function finishPlaying() {
        hasPlayed = true;
        pendingPlay = false;
        phase = 'playing';
        preview.hidden = true;
        hideStatus();
    }

    function focusVideo() {
        try { video.focus({ preventScroll: true }); }
        catch (error) { video.focus(); }
    }

    function startVideo() {
        requested = true;
        pendingPlay = true;
        const attempt = ++generation;
        preview.hidden = true;
        showWaiting('loading');
        focusVideo();
        try {
            // Keep play() in the click handler so mobile browsers retain the
            // user's playback permission, including when retrying a request.
            const request = video.play();
            if (request && typeof request.then === 'function') {
                request.then(function () {
                    if (attempt !== generation) return;
                    pendingPlay = false;
                    if (!video.paused && !video.seeking && video.readyState >= 3) finishPlaying();
                }).catch(function () {
                    if (attempt === generation) showError();
                });
            }
        } catch (error) {
            if (attempt === generation) showError();
        }
    }

    preview.addEventListener('click', startVideo);

    retry.addEventListener('click', function () {
        // load() resets the media timeline. Restore it once metadata returns.
        if (Number.isFinite(video.currentTime) && video.currentTime > 0) {
            savedPosition = video.currentTime;
        }
        ++generation;
        pendingPlay = false;
        clearWaitTimer();
        phase = 'idle';
        video.load();
        startVideo();
    });

    video.addEventListener('loadedmetadata', function () {
        if (savedPosition === null) return;
        const target = Number.isFinite(video.duration)
            ? Math.min(savedPosition, Math.max(0, video.duration - 0.05))
            : savedPosition;
        savedPosition = null;
        try { video.currentTime = target; }
        catch (error) { /* A non-seekable video can still restart normally. */ }
    });

    video.addEventListener('play', function () {
        requested = true;
        if (video.readyState < 3) showWaiting(hasPlayed ? 'buffering' : 'loading');
    });

    video.addEventListener('playing', finishPlaying);

    video.addEventListener('waiting', function () {
        if (requested && !video.paused && !video.ended && phase !== 'error') {
            showWaiting(hasPlayed ? 'buffering' : 'loading');
        }
    });

    video.addEventListener('stalled', function () {
        // A stalled preload request is harmless if the video has enough data.
        if (requested && !video.paused && !video.ended && video.readyState < 3 && phase !== 'error') {
            showWaiting(hasPlayed ? 'buffering' : 'loading');
        }
    });

    video.addEventListener('pause', function () {
        if (!video.paused || phase === 'error') return;
        ++generation;
        pendingPlay = false;
        phase = 'paused';
        hideStatus();
    });

    video.addEventListener('seeking', function () {
        if (requested && !video.paused && phase !== 'error') showWaiting('buffering');
    });

    video.addEventListener('seeked', function () {
        if (phase === 'error') return;
        if (video.paused) hideStatus();
        else if (video.readyState >= 3) finishPlaying();
    });

    video.addEventListener('ended', function () {
        ++generation;
        pendingPlay = false;
        phase = 'ended';
        hideStatus();
    });

    video.addEventListener('error', function () {
        if (requested) {
            ++generation;
            showError();
        }
    });
})();

</script>
</body>
</html>
