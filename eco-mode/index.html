
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TCL The Floor &amp; Ceiling | Eco Mode</title>

<style>
:root {
    --navy: #17345f;
    --blue-gray: #637b98;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
    padding: 20px;
}

.logo {
    width: 90px;
    margin-bottom: 8px;
}

h1 {
    color: var(--navy);
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 25px;
}

.video-title {
    color: var(--blue-gray);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 15px;
}

.video-box {
    width: 90vw;
    max-width: 850px;
    aspect-ratio: 16 / 9;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    background: #081423;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.preview-button {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: #081423;
    cursor: pointer;
}

.preview-button img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.play-icon {
    position: relative;
    z-index: 1;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 4px;
    border-radius: 50%;
    background: rgba(23, 52, 95, 0.88);
    color: #fff;
    font-size: 31px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .2);
}

.preview-button[hidden],
.video-message[hidden] {
    display: none;
}

.video-message {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px;
    background: rgba(8, 20, 35, .9);
    color: #fff;
    font-size: 15px;
    text-align: center;
}

.video-message a {
    color: #afd8ff;
}

@media (max-width: 600px) {
    .container {
        padding: 15px;
    }

    .logo {
        width: 75px;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 20px;
    }

    .video-title {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .play-icon {
        width: 56px;
        height: 56px;
        font-size: 28px;
    }
}
</style>
</head>

<body>
<div class="container">

    <img
        class="logo"
        src="../brand-logo.png"
        alt="TCL Logo"
    >

    <h1>TCL The Floor &amp; Ceiling</h1>

    <div class="video-title">Eco Mode</div>

    <div class="video-box">

        <video
            id="trainingVideo"
            controls
            preload="auto"
            playsinline
            webkit-playsinline
        >
            <source src="ecomode.mp4" type="video/mp4">
            Your browser does not support HTML video.
        </video>

        <button
            class="preview-button"
            id="previewButton"
            type="button"
            aria-label="Play Eco Mode video"
        >
            <img
                src="preview-eco-mode.jpg"
                alt="Eco Mode video preview"
            >
            <span class="play-icon" aria-hidden="true">&#9654;</span>
        </button>

        <div
            class="video-message"
            id="videoMessage"
            role="status"
            aria-live="polite"
            hidden
        >
            <span id="messageText">Loading video...</span>
            <a
                id="directVideoLink"
                href="ecomode.mp4"
                target="_blank"
                rel="noopener"
                hidden
            >Open MP4 directly</a>
        </div>

    </div>
</div>

<script>
(function () {
    const video = document.getElementById('trainingVideo');
    const button = document.getElementById('previewButton');
    const message = document.getElementById('videoMessage');
    const messageText = document.getElementById('messageText');
    const directLink = document.getElementById('directVideoLink');

    function showLoading() {
        messageText.textContent = 'Loading video...';
        directLink.hidden = true;
        message.hidden = false;
    }

    function showError(detail) {
        messageText.textContent = detail;
        directLink.hidden = false;
        message.hidden = false;
    }

    button.addEventListener('click', function () {
        // Hide the preview and start the actual MP4.
        button.hidden = true;
        showLoading();

        try {
            const playRequest = video.play();

            if (playRequest && typeof playRequest.catch === 'function') {
                playRequest.catch(function (error) {
                    showError(
                        'Playback failed: ' +
                        (error.message || error.name) +
                        '. Please check the MP4 file.'
                    );
                });
            }
        } catch (error) {
            showError('Unable to start video playback.');
        }
    });

    video.addEventListener('playing', function () {
        message.hidden = true;
    });

    video.addEventListener('error', function () {
        if (button.hidden) {
            showError(
                'Video failed to load. Check the MP4 filename, upload path, network, or format.'
            );
        }
    });
})();
</script>

</body>
</html>
